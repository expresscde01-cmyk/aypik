<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Aypik — Maintenance en cours</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fdf9f6; font-family: Arial, Helvetica, sans-serif; color: #374151; }
  .wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
  .card { max-width: 440px; width: 100%; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 24px; padding: 40px 32px; text-align: center; box-shadow: 0 10px 30px rgba(17, 24, 39, 0.06); }
  .icon { width: 56px; height: 56px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; background: #f3f4f6; border-radius: 16px; }
  h1 { margin: 0 0 4px; font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 800; color: #f97316; }
  h2 { margin: 0 0 16px; font-size: 22px; line-height: 1.3; color: #111827; }
  p { margin: 0 0 8px; font-size: 15px; line-height: 1.6; color: #4b5563; }
  .sub { margin-top: 20px; font-size: 13px; color: #9ca3af; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </div>
      <h1>Aypik</h1>
      <h2>Site en maintenance</h2>
      <p>Nous effectuons actuellement une mise à jour pour améliorer votre expérience.</p>
      <p>Le site sera de retour très bientôt — merci de votre patience !</p>
      <div class="sub">Si besoin, réessayez dans quelques minutes.</div>
    </div>
  </div>
</body>
</html>
