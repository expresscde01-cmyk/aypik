<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Aypik — Maintenance en cours</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fdf9f6; font-family: Arial, Helvetica, sans-serif; color: #374151; }
  .page-glow {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: radial-gradient(circle at 50% 38%, rgba(253,224,71,0.4) 0%, rgba(251,191,36,0.22) 20%, rgba(251,146,60,0.1) 40%, rgba(251,146,60,0) 65%);
    opacity: 0;
    animation: pageGlow 5.5s ease-in-out infinite;
    will-change: opacity;
  }
  @keyframes pageGlow {
    0%, 85% { opacity: 0; }
    90%, 93% { opacity: 0.55; }
    97% { opacity: 0.7; }
    100% { opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .page-glow { animation: none; opacity: 0; }
  }
  .wrap { position: relative; z-index: 1; min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
  .card { max-width: 440px; width: 100%; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 24px; padding: 40px 32px; text-align: center; box-shadow: 0 10px 30px rgba(17, 24, 39, 0.06); }
  .icon { position: relative; width: 64px; height: 64px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; overflow: visible; }
  .icon svg { overflow: visible; position: relative; z-index: 2; }
  .icon::before {
    content: '';
    position: absolute;
    inset: 0;
    background: #ffffff;
    border: 1px solid #f3f4f6;
    border-radius: 18px;
    box-shadow: 0 6px 16px rgba(17, 24, 39, 0.08);
    z-index: 0;
    animation: frameFade 5.5s ease-in-out infinite;
    will-change: opacity;
  }
  .icon::after {
    content: '';
    position: absolute;
    inset: -34px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(253,224,71,1) 0%, rgba(251,191,36,0.9) 22%, rgba(251,191,36,0.55) 45%, rgba(251,146,60,0.25) 65%, rgba(251,146,60,0) 80%);
    opacity: 0;
    z-index: 1;
    pointer-events: none;
    animation: flash 5.5s ease-in-out infinite;
    will-change: opacity, transform, filter;
  }
  @keyframes frameFade {
    0%, 82% { opacity: 1; }
    88% { opacity: 0.5; }
    91%, 95% { opacity: 0; }
    100% { opacity: 1; }
  }
  .heart-shape { transform-box: fill-box; transform-origin: center; animation: heartGrow 5.5s ease-in-out infinite; will-change: transform; }
  @keyframes heartGrow {
    0%, 82% { transform: scale(1); }
    88% { transform: scale(1.08); }
    91%, 95% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  .sparkle { transform-box: fill-box; transform-origin: center; animation: twinkle 5.5s linear infinite; will-change: transform, opacity, filter; }
  @keyframes twinkle {
    0% { opacity: 0; transform: scale(0.35) rotate(0deg); fill: #ffffff; filter: blur(0px) drop-shadow(0 0 0px rgba(255,255,255,0)); }
    22% { opacity: 0.4; transform: scale(0.48) rotate(1deg); fill: #ffffff; filter: blur(0px) drop-shadow(0 0 0px rgba(255,255,255,0.1)); }
    42% { opacity: 0.6; transform: scale(0.58) rotate(2deg); fill: #ffffff; filter: blur(0px) drop-shadow(0 0 1px rgba(255,255,255,0.2)); }
    60% { opacity: 0.75; transform: scale(0.66) rotate(3deg); fill: #ffffff; filter: blur(0px) drop-shadow(0 0 1px rgba(255,255,255,0.25)); }
    72% { opacity: 0.88; transform: scale(0.78) rotate(4deg); fill: #ffffff; filter: blur(0px) drop-shadow(0 0 1px rgba(255,255,255,0.35)); }
    82% {
      opacity: 1;
      transform: scale(1.0) rotate(5deg);
      fill: #ffffff;
      filter: blur(0px) drop-shadow(0 0 4px rgba(255,255,255,0.6));
    }
    88% {
      opacity: 1;
      transform: scale(1.15) rotate(7deg);
      fill: #ffffff;
      filter: blur(0.3px) drop-shadow(0 0 5px rgba(255,255,255,0.7));
    }
    91% {
      opacity: 1;
      transform: scale(1.3) rotate(8deg);
      fill: #fbbf24;
      filter: blur(0.8px) drop-shadow(0 0 6px rgba(253,224,71,0.85)) drop-shadow(0 0 14px rgba(251,146,60,0.6));
    }
    95% {
      opacity: 1;
      transform: scale(1.3) rotate(8deg);
      fill: #fbbf24;
      filter: blur(1.6px) drop-shadow(0 0 6px rgba(253,224,71,0.85)) drop-shadow(0 0 16px rgba(251,146,60,0.6));
    }
    100% { opacity: 0; transform: scale(0.4) rotate(0deg); fill: #ffffff; filter: blur(0px) drop-shadow(0 0 0px rgba(255,255,255,0)); }
  }
  @keyframes flash {
    0%, 88% { opacity: 0; transform: scale(0.5); filter: blur(0px); }
    91%, 93% { opacity: 1; transform: scale(1); filter: blur(0px); }
    97% { opacity: 0.45; transform: scale(1.2); filter: blur(1.5px); }
    100% { opacity: 0; transform: scale(1.6); filter: blur(5px); }
  }
  .heart-highlight { animation: highlightFade 5.5s ease-in-out infinite; will-change: opacity; }
  @keyframes highlightFade {
    0%, 88% { opacity: 1; }
    91%, 95% { opacity: 0; }
    100% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sparkle { animation: none; opacity: 1; }
    .icon::after { animation: none; opacity: 0; }
    .icon::before { animation: none; opacity: 1; }
    .heart-highlight { animation: none; opacity: 1; }
    .heart-shape { animation: none; transform: scale(1); }
  }
  h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 800; color: #111827; }
  h2 { margin: 16px 0 16px; font-size: 22px; line-height: 1.3; color: #111827; }
  p { margin: 0 0 8px; font-size: 15px; line-height: 1.6; color: #4b5563; }
  .sub { margin-top: 20px; font-size: 13px; color: #9ca3af; }
</style>
</head>
<body>
  <div class="page-glow"></div>
  <div class="wrap">
    <div class="card">
      <div class="icon">
        <svg width="34" height="34" viewBox="0 0 24 24">
          <defs>
            <linearGradient id="heartGrad" x1="0.1" y1="0" x2="0.9" y2="1">
              <stop offset="0%" stop-color="#fb7185"/>
              <stop offset="45%" stop-color="#f43f5e"/>
              <stop offset="100%" stop-color="#fbbf24"/>
            </linearGradient>
            <radialGradient id="heartHighlight" cx="32%" cy="22%" r="45%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <g class="heart-shape">
            <path fill="url(#heartGrad)" d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z"/>
            <path class="heart-highlight" fill="url(#heartHighlight)" d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z"/>
          </g>
          <path class="sparkle" fill="#ffffff" d="M16.3 5.2l.55 1.65 1.65.55-1.65.55-.55 1.65-.55-1.65-1.65-.55 1.65-.55z"/>
        </svg>
      </div>
      <h1>Aypik</h1>
      <h2>Site en maintenance</h2>
      <p>Nous effectuons actuellement une mise à jour pour améliorer votre expérience.</p>
      <p>Le site sera de retour très bientôt — merci de votre patience !</p>
      <div class="sub">Si besoin, réessayez dans quelques minutes.</div>
    </div>
  </div>
</body>
</html>
